function redesignedServersPage(){return heading(btn('刷新列表','refresh-servers','refresh'))+`<div class="toolbar"><div class="hover-track segment community-region"><button class="${state.serverRegion==='cn'?'active':''}" aria-pressed="${state.serverRegion==='cn'}" data-action="servers-cn">中国大陆</button><button class="${state.serverRegion==='global'?'active':''}" aria-pressed="${state.serverRegion==='global'}" data-action="servers-global">国际社区</button></div><label class="search">${I('search')}<input id="server-search" aria-label="搜索服务器" placeholder="搜索服务器、地图…" value="${esc(state.serverQuery)}"></label><select id="server-mode" aria-label="游戏模式"><option value="all">所有模式</option>${[...new Set(servers.filter(s=>s.region===state.serverRegion).map(s=>s.mode).filter(Boolean))].map(s=>`<option ${state.serverMode===s?'selected':''}>${s}</option>`).join('')}</select><select id="server-map" aria-label="地图筛选"><option value="all">所有地图</option>${[...new Set(servers.map(s=>s.map))].map(s=>`<option ${state.serverMap===s?'selected':''}>${s}</option>`).join('')}</select></div><div id="server-results">${redesignedServerResults()}</div>`;}
function redesignedFilteredServers(){return servers.filter(s=>s.region===state.serverRegion&&(state.serverMode==='all'||s.mode===state.serverMode)&&(state.serverMap==='all'||s.map===state.serverMap)&&`${s.name} ${s.map} ${s.mode}`.toLowerCase().includes(state.serverQuery.toLowerCase()));}
const communityListView={status:'online',fetchedAt:null,refreshing:false};
function communityStatus(available){
  const {status,fetchedAt,refreshing}=communityListView;
  const message=refreshing?(fetchedAt==null?'正在连接服务器列表…':'正在刷新…'):status==='stale'?'连接失败 · 显示上次列表':status==='unavailable'?'服务器列表连接失败':!available?'当前没有在线服务器':'';
  return message?`<div class="community-list-status" data-status="${refreshing?'loading':status}"><span role="status">${message}</span>${!refreshing&&['stale','unavailable'].includes(status)?btn('重试','refresh-servers','refresh','small'):''}</div>`:'';
}
function redesignedServerResults(){const list=filteredServers();if(!list.some(s=>s.id===state.selectedServer))state.selectedServer=list[0]?.id||null;const s=list.find(s=>s.id===state.selectedServer),total=list.reduce((sum,x)=>sum+x.players,0);const available=servers.some(row=>row.region===state.serverRegion),stamp=communityListView.fetchedAt==null?'—':new Date(communityListView.fetchedAt).toLocaleTimeString(document.documentElement.lang);return `<div class="server-layout"><section class="panel list-panel">${communityStatus(available)}<div class="table-scroll"><table class="server-table"><thead><tr><th>服务器名称</th><th>模式 / 地图</th><th class="num">玩家</th><th class="num">延迟</th></tr></thead><tbody>${list.map(x=>`<tr data-server="${x.id}" tabindex="0" class="${x.id===state.selectedServer?'selected':''}" aria-label="查看 ${esc(x.name)}"><td><div class="server-name"><div><strong>${esc(x.name)}</strong><small>${esc(x.owner)}</small></div></div></td><td>${x.mode}<span class="server-map">${x.map}</span></td><td class="num">${x.players}<span class="faint"> / ${x.max}</span></td><td class="num ${x.ping<60?'positive':'muted'}">${x.ping} <span class="faint">ms</span></td></tr>`).join('')}</tbody></table>${!list.length&&available?`<div class="empty">${I('search')}<strong>没有匹配的服务器</strong><p>试试其他关键词或清除筛选。</p><button class="text-button" data-action="clear-server-filters">清除筛选</button></div>`:''}</div><div class="table-foot"><span>${list.length} 个服务器  /  ${total} 位铁驭在线</span><span>数据快照 <span id="refresh-time">${stamp}</span></span></div></section>${s?`<aside class="panel server-detail ${state.serverDetailOpen?'mobile-open':''}"><div class="server-banner"><span>${s.map}</span></div><h2 class="detail-title">${esc(s.name)}</h2><p class="detail-description">${esc(s.desc)}</p><dl class="detail-grid"><div><dt>游戏模式</dt><dd>${s.mode}</dd></div><div><dt>延迟</dt><dd class="positive">${s.ping} ms</dd></div><div><dt>当前玩家</dt><dd>${s.players} / ${s.max}</dd></div><div><dt>服务区域</dt><dd>${s.region==='cn'?'中国大陆':'国际社区'}</dd></div></dl><div class="server-row-detail">模组要求：${esc(s.mods)}</div></aside>`:''}</div>`;}
function redesignedLaunch(){
  if(state.game==='northstar'&&!state.ns[state.region])return installClientModal();
  if(state.game==='vanilla'&&state.vanilla==='mods'&&state.runtime!=='global')return confirmModal('原版带 Mod 需要国际版框架','安装国际版 Northstar 框架后，即可使用原版带 Mod 模式。替换将保留用户 mods 文件夹。','replace-runtime','安装国际版框架');
  if(state.busy)return;
  state.busy=true;state.launchProgress=0;state.launchStep='正在启动';
  const button=document.querySelector('.launch-button'),consolePanel=document.querySelector('.play-stage');
  if(button){button.disabled=true;button.innerHTML=I('refresh')+'<span class="launch-button-label">正在启动</span>'+I('arrow');}
  consolePanel?.classList.remove('launch-complete');consolePanel?.classList.add('is-launching');consolePanel?.setAttribute('aria-busy','true');
  document.querySelector('.launch-inline-progress')?.classList.remove('is-done');
  document.querySelectorAll('.launch-checklist li').forEach(el=>el.classList.remove('is-checked'));
  const update=()=>{const number=document.getElementById('launch-progress-number'),step=document.getElementById('launch-progress-step'),bar=document.getElementById('launch-progress-bar');if(number)number.textContent=state.launchProgress+'%';if(step)step.textContent=state.launchStep;if(bar)bar.style.width=state.launchProgress+'%';document.querySelector('.launch-progress-track')?.setAttribute('aria-valuenow',String(state.launchProgress));document.querySelectorAll('.launch-checklist li').forEach((el,i)=>el.classList.toggle('is-checked',state.launchProgress>=(i+1)*25));};
  update();
  const steps=['启动环境已确认','模组配置已载入','EA 连接已就绪','启动完成'];let current=0;
  const timer=setInterval(()=>{state.launchProgress=++current*25;state.launchStep=steps[current-1];update();if(current===steps.length){clearInterval(timer);state.busy=false;document.querySelector('.play-stage')?.classList.remove('is-launching');document.querySelector('.play-stage')?.classList.add('launch-complete');document.querySelector('.play-stage')?.setAttribute('aria-busy','false');document.querySelector('.launch-inline-progress')?.classList.add('is-done');const button=document.querySelector('.launch-button');if(button?.isConnected){button.disabled=false;button.innerHTML=I('checkcircle')+'<span class="launch-button-label">启动完成</span>'+I('arrow');setTimeout(()=>{if(button.isConnected&&!state.busy)button.innerHTML=I('play')+'<span class="launch-button-label">'+tr('launch')+'</span>'+I('arrow');},1600);}toast('模拟启动完成 · 欢迎回到边境');}},430);
}

function filteredServers(){return servers.filter(s=>s.region===state.serverRegion&&(state.serverFilter!=='favorites'||state.favorites.includes(s.id))&&(state.serverMode==='all'||s.mode===state.serverMode)&&(state.serverMap==='all'||s.map===state.serverMap)&&`${s.name} ${s.map} ${s.mode}`.toLowerCase().includes(state.serverQuery.toLowerCase()));}
function serversPage(){return heading(btn('刷新列表','refresh-servers','refresh'))+`<div class="toolbar"><div class="segment"><button class="${state.serverRegion==='cn'?'active':''}" data-action="servers-cn">中国大陆</button><button class="${state.serverRegion==='global'?'active':''}" data-action="servers-global">国际社区</button></div><label class="search">${I('search')}<input id="server-search" aria-label="搜索服务器" placeholder="搜索服务器、地图…" value="${esc(state.serverQuery)}"></label><select id="server-mode" aria-label="游戏模式"><option value="all">所有模式</option>${['消耗战','边境防御','身法训练','实弹演习'].map(s=>`<option ${state.serverMode===s?'selected':''}>${s}</option>`).join('')}</select><select id="server-map" aria-label="地图筛选"><option value="all">所有地图</option>${[...new Set(servers.map(s=>s.map))].map(s=>`<option ${state.serverMap===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="tabbar"><button data-action="serverfilter-all" class="${state.serverFilter==='all'?'active':''}">全部服务器 <small>${servers.filter(s=>s.region===state.serverRegion).length}</small></button><button data-action="serverfilter-favorites" class="${state.serverFilter==='favorites'?'active':''}">我的收藏 <small>${servers.filter(s=>s.region===state.serverRegion&&state.favorites.includes(s.id)).length}</small></button></div><div id="server-results">${serverResults()}</div>`;}
function serverResults(){const list=filteredServers();if(!list.some(s=>s.id===state.selectedServer))state.selectedServer=list[0]?.id||null;const s=list.find(s=>s.id===state.selectedServer);const total=list.reduce((sum,s)=>sum+s.players,0);return `<div class="server-layout"><section class="panel list-panel"><div class="table-scroll"><table class="server-table"><thead><tr><th>服务器名称</th><th>模式 / 地图</th><th class="num">玩家</th><th class="num">延迟</th></tr></thead><tbody>${list.map(s=>`<tr data-server="${s.id}" tabindex="0" class="${s.id===state.selectedServer?'selected':''}" aria-label="查看 ${esc(s.name)}"><td><div class="server-name"><button class="favorite ${state.favorites.includes(s.id)?'saved':''}" data-action="favorite-${s.id}" aria-label="${state.favorites.includes(s.id)?'取消收藏':'收藏'} ${esc(s.name)}">${I('star')}</button><div><strong>${s.name}</strong><small>${s.owner}</small></div></div></td><td>${s.mode}<span class="server-map">${s.map}</span></td><td class="num">${s.players}<span class="faint"> / ${s.max}</span></td><td class="num ${s.ping<60?'positive':'muted'}">${s.ping} <span class="faint">ms</span></td></tr>`).join('')}</tbody></table>${!list.length?`<div class="empty">${I('search')}<strong>没有匹配的服务器</strong><p>试试其他关键词或清除筛选。</p><button class="text-button" data-action="clear-server-filters">清除筛选</button></div>`:''}</div><div class="table-foot"><span>${list.length} 个服务器  /  ${total} 位铁驭在线</span><span>数据快照 <span id="refresh-time">刚刚</span></span></div></section>${s?`<aside class="panel server-detail ${state.serverDetailOpen?'mobile-open':''}"><div class="server-banner"><span>${s.map}</span></div><h2 class="detail-title">${s.name}</h2><p class="detail-description">${s.desc}</p><dl class="detail-grid"><div><dt>游戏模式</dt><dd>${s.mode}</dd></div><div><dt>延迟</dt><dd class="positive">${s.ping} ms</dd></div><div><dt>当前玩家</dt><dd>${s.players} / ${s.max}</dd></div><div><dt>服务区域</dt><dd>${s.region==='cn'?'中国大陆':'国际社区'}</dd></div></dl><div class="detail-actions">${btn(s.playe function modsPage(){const tabs=`<div class="hover-track tabbar mod-tabs"><button data-action="modtab-installed" class="${state.modTab==='installed'?'active':''}">多人模组 <small>${state.mods.filter(m=>m.kind!=='icepick').length}</small></button><button data-action="modtab-icepick" class="${state.modTab==='icepick'?'active':''}">Icepick 模组 <small>${state.mods.filter(m=>m.kind==='icepick').length}</small></button><button data-action="modtab-discover" class="${state.modTab==='discover'?'active':''}">发现模组</button><button data-action="modtab-arsenal" class="${state.modTab==='arsenal'?'active':''}">武器库</button></div>`;return heading(state.modTab==='arsenal'?'':btn('导入模组','import-mod','upload','primary'))+tabs+(state.modTab==='discover'?catalogPage():state.modTab==='arsenal'?arsenalPage():installedMods());}

function markDirty(){state.dirty=true;const status=document.getElementById('save-status'),save=document.querySelector('[data-action="save-settings"]');if(status)status.textContent='有尚未保存的更改';document.querySelector('.settings-save')?.classList.add('is-dirty');if(save){save.classList.remove('is-saved');save.innerHTML=I('check')+tr('save');}}
function bindLocalInputs(){const bind=(id,event,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(event,fn);};bind('server-search','input',e=>{state.serverQuery=e.target.value;updateServerResults();});bind('server-mode','change',e=>{state.serverMode=e.target.value;updateServerResults();});bind('server-map','change',e=>{state.serverMap=e.target.value;updateServerResults();});bind('mod-search','input',e=>{state.modQuery=e.target.value;updateModRows();});bind('catalog-search','input',e=>{state.catalogQuery=e.target.value;updateCatalogResults();});bind('catalog-filter','change',e=>{state.catalogFilter=e.target.value;updateCatalogResults();});bind('arsenal-search','input',e=>{const cursor=e.target.selectionStart;state.arsenal.query=e.target.value;render();const input=document.getElementById('arsenal-search');input?.focus({preventScroll:true});input?.setSelectionRange(cursor,cursor);});bind('ui-language','change',e=>{setLanguage(e.target.value);markDirty();});bind('ns-args','input',e=>{state.nsArgs=e.target.value;markDirty();});const dz=document.getElementById('dropzone');if(dz){dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});dz.addEventListener('dragleave',e=>{if(!dz.contains(e.relatedTarget))dz.classList.remove('dragover');});dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');handleFiles(e.dataTransfer.files);});}}

function progressModal(title,steps,onDone){if(state.busy)return;state.busy=true;showModal(title,`<div class="progress-label"><span id="progress-step">${steps[0]}</span><span id="progress-number">0%</span></div><div class="progress"><div id="progress-bar"></div></div><div class="log" id="progress-log"></div>`);let current=0;const timer=setInterval(()=>{current++;const percent=Math.min(Math.round(current/steps.length*100),100);document.getElementById('progress-number').textContent=percent+'%';document.getElementById('progress-step').textContent=steps[current-1];document.getElementById('progress-bar').style.width=percent+'%';document.getElementById('progress-log').innerHTML+=`[OK] ${esc(steps[current-1])}<br>`;if(current>=steps.length){clearInterval(timer);state.busy=false;onDone();showModal('准备完成',`<div class="row" style="margin-bottom:16px;color:var(--green)">${I('checkcircle')}<strong>${title}完成</strong></div><p class="modal-description">${steps[steps.length-1]}。这是前端流程预览，没有修改磁盘文件。</p>`,btn('完成','close-modal','check','primary'));render();}},530);}
function directoryModal(kind='current'){const path=kind==='game'?state.gamePath:kind==='global'?state.nsPaths.global:state.game==='northstar'?state.nsPaths[state.region]:state.gamePath;showModal('选择安装目录',`<p class="modal-description"></p><div class="install-location"><label for="directory-input">目录路径</label><input id="directory-input" value="${esc(path)}"><div class="location-status">${I('checkcircle')} NTFS  /  128.4 GB 可用  /  目录检查通过（模拟）</div></div><input id="directory-kind" type="hidden" value="${kind}">`,btn('取消','close-modal')+btn('使用此目录','confirm-directory','folder','primary'));}

function launch(){if(state.game==='northstar'&&!state.ns[state.region])return installClientModal();if(state.game==='vanilla'&&state.vanilla==='mods'&&state.runtime!=='global'){if(state.runtime==='cn')confirmModal('原版带 Mod 需要国际版框架','检测到游戏根目录中安装了国服北极星。此模式需要国际版 Northstar：替换会清理国服框架文件，并保留你的用户 mods 文件夹。是否继续？','replace-runtime','同意并替换');else confirmModal('尚未安装国际版 Northstar','原版带 Mod 需要在游戏根目录安装国际版 Northstar 框架。安装后即可使用此模式。','replace-runtime','安装国际版框架');return;}progressModal('启动游戏',['检查启动环境','读取当前模组配置','准备 EA 连接','游戏启动流程已就绪'],()=>toast('模拟启动完成  /  欢迎回到边境'));}

function handleFiles(files){if(!files.length)return;const file=files[0],name=file.name,lower=name.toLowerCase();const format=lower.endsWith('.dds')?'DDS':lower.endsWith('.vtf')?'VTF':lower.includes('icepick')?'Icepick':lower.includes('mod')||lower.includes('northstar')||lower==='mod.json'?'Northstar Mod':null;if(!format){showModal('选择压缩包类型',`<p class="modal-description">已接收 ${esc(name)}。这个通用压缩包名称不能确定格式，请选择对应工作区继续预览。</p><div class="language-options">${['DDS','VTF','Northstar Mod','Icepick'].map(f=>`<button data-action="classify-${f}">${f}${I('arrow')}</button>`).join('')}</div>`);state.pendingFile={name,size:(file.size/1024/1024).toFixed(1)+' MB'};return;}state.format=format;state.file={name,size:(file.size/1024/1024).toFixed(1)+' MB'};if(state.page!=='installer')navigate('installer');else render();toast('已自动识别 '+format+'，文件仅用于预览');}

document.addEventListener('click',e=>{const switchButton=e.target.closest('button.toggle');if(switchButton){if(state.busy||switchButton.disabled)return;const action=switchButton.dataset.action;let enabled;if(action.startsWith('modtoggle-')){const mod=state.mods.find(m=>m.id===action.slice(10));if(!mod||mod.core)return;mod.enabled=!mod.enabled;enabled=mod.enabled;}else if(action==='ea-toggle'){state.eaEnabled=!state.eaEnabled;enabled=state.eaEnabled;toast('EA 模拟器'+(enabled?'已启用':'已关闭'));}else if(action==='independent'){state.independent=!state.independent;enabled=state.independent;toast('独立模组配置'+(enabled?'已开启':'已关闭'));}else if(action==='independent-setting'){state.independent=!state.independent;enabled=state.independent;markDirty();}else if(action==='protection-toggle'){state.protection=!state.protection;enabled=state.protection;markDirty();}else if(action==='auto-update'){state.autoUpdate=!state.autoUpdate;enabled=state.autoUpdate;markDirty();}else if(action==='update-backup'){state.updateBackup=!state.updateBackup;enabled=state.updateBackup;markDirty();}else return;switchButton.classList.toggle('on',enabled);switchButton.setAttribute('aria-checked',String(enabled));animateToggle(switchButton,enabled);refreshModFeedback(switchButton);return;}const action=e.target.closest('[data-action]');if(action){if(state.busy)return;perform(action.dataset.action);return;}const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page,Boolean(page.closest('.rail')));return;}const row=e.target.closest('[data-server]');if(row){selectServer(Number(row.dataset.server));return;}if(state.sortMenuOpen){state.sortMenuOpen=false;render();}});

document.addEventListener('keydown',e=>{if(!state.sortMenuOpen)return;if(e.key==='Escape'){state.sortMenuOpen=false;render();document.querySelector('.sort-trigger')?.focus();return;}if(e.key==='ArrowDown'||e.key==='ArrowUp'){const options=[...document.querySelectorAll('.sort-menu [role="menuitemradio"]')],index=options.indexOf(document.activeElement),step=e.key==='ArrowDown'?1:-1;options[(index+step+options.length)%options.length]?.focus();e.preventDefault();}});

arsenalPage=function(){const weapon=arsenalWeapons.find(([id])=>id===state.arsenal.weapon),name=weapon?.[1]||'全部武器',items=arsenalRecords.filter(item=>(state.arsenal.weapon==='all'||item.weapon===state.arsenal.weapon)&&(state.arsenal.format==='all'||item.format.toLowerCase()===state.arsenal.format)&&(state.arsenal.query===''||`${item.name} ${item.format} ${item.state}`.toLowerCase().includes(state.arsenal.query.toLowerCase()))),filters=[['all','全部'],['dds','DDS'],['vtf','VTF']],visibleWeapons=state.arsenal.weaponsExpanded?arsenalWeapons:arsenalWeapons.slice(0,5),visibleItems=state.arsenal.recordsExpanded?items:items.slice(0,6);return `<div class="arsenal-heading"><div><h2>武器材质记录</h2></div><label class="search">${I('search')}<input id="arsenal-search" aria-label="搜索武器材质记录" placeholder="搜索记录" value="${esc(state.arsenal.query)}"></label></div><div class="arsenal-layout"><section class="arsenal-weapons" aria-label="武器列表"><div class="arsenal-column-heading"><strong>选择武器</strong><span>${arsenalWeapons.length+1} 项</span></div><button class="arsenal-weapon ${state.arsenal.weapon==='all'?'active':''}" data-action="arsenal-weapon-all"><span>全部武器</span><small>${arsenalRecords.length}</small></button>${visibleWeapons.map(([id,label,category])=>`<button class="arsenal-weapon ${state.arsenal.weapon===id?'active':''}" data-action="arsenal-weapon-${id}"><span>${label}<small>${category}</small></span><small>${arsenalRecords.filter(item=>item.weapon===id).length}</small></button>`).join('')}${arsenalWeapons.length>5?`<button class="arsenal-expand" data-action="arsenal-toggle-weapons">${state.arsenal.weaponsExpanded?'收起武器':'展开全部武器'} <span>${state.arsenal.weaponsExpanded?'':'（'+(arsenalWeapons.length-5)+'）'}</span></button>`:''}</section><section class="arsenal-records"><div class="arsenal-toolbar"><div class="arsenal-selection"><h3>${name}</h3><span>${items.length} 条记录</span></div><div class="arsenal-toolbar-actions"><div class="arsenal-filters" role="group" aria-label="材质格式">${filters.map(([value,label])=>`<button class="${state.arsenal.format===value?'active':''}" data-action="arsenal-format-${value}" aria-pressed="${state.arsenal.format===value}">${label}</button>`).join('')}</div><button class="text-button arsenal-restore-top" data-action="arsenal-restore-original" ${name==='全部武器'||state.arsenal.restoredOriginal.includes(state.arsenal.weapon)?'disabled':''}>${I('refresh')} 恢复原始材质</button></div></div>${visibleItems.length?`<div class="arsenal-list">${visibleItems.map(item=>`<article class="arsenal-row" data-record-state="${item.state==='原始备份'?'original':item.state==='当前装配'&&!state.arsenal.restoredOriginal.includes(item.weapon)?'current':'history'}"><span class="arsenal-format">${item.format}</span><div class="grow"><strong>${item.name}</strong><small>${item.state}　${item.time}</small></div>${item.state==='原始备份'?badge('原始备份'):item.state==='当前装配'?badge(state.arsenal.restoredOriginal.includes(item.weapon)?'已恢复原始':'当前'):btn('还原此记录','arsenal-restore-'+item.id,'refresh','small ghost')}</article>`).join('')}</div>`:`<div class="empty"><strong>没有匹配的记录</strong></div>`}${items.length>6?`<button class="arsenal-expand" data-action="arsenal-toggle-records">${state.arsenal.recordsExpanded?'收起记录':'展开全部记录'} <span>${state.arsenal.recordsExpanded?'':'（'+(items.length-6)+'）'}</span></button>`:''}${state.arsenal.confirm?`<div class="arsenal-confirm" role="group"><strong>${state.arsenal.confirm==='original'?'恢复原始材质？':'还原已选记录？'}</strong><span>${state.arsenal.confirm==='original'?'所选武器的 DDS 和 VTF 文件将恢复为原始状态。':'所选武器将切换回该历史材质记录。'}</span><div><button class="text-button" data-action="arsenal-cancel">取消</button><button class="btn primary" data-action="arsenal-confirm">确认还原</button></div></div>`:''}</section></div>`;};
perform=function(action){if(action==='arsenal-toggle-weapons'){state.arsenal.weaponsExpanded=!state.arsenal.weaponsExpanded;render();return;}if(action==='arsenal-toggle-records'){state.arsenal.recordsExpanded=!state.arsenal.recordsExpanded;render();return;}if(action==='confirm-reset-settings'){originalPerform(action);state.theme=TFXThemes.defaultId;document.documentElement.dataset.theme=TFXThemes.defaultId;syncThemeVariables();render();return;}originalPerform(action);};

function syncThemeVariables(){const root=getComputedStyle(document.documentElement),bg=root.getPropertyValue('--bg').trim(),textColor=root.getPropertyValue('--text').trim();for(const name of themeVariableNames)document.body.style.setProperty(name,root.getPropertyValue(name).trim());document.body.style.setProperty('background-color',bg,'important');document.body.style.color=textColor;const wallpaper=document.querySelector('.wallpaper');if(wallpaper)wallpaper.style.setProperty('background-color',bg,'important');}
